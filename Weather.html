<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="Weather.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="search-box">
                <input type="text" placeholder="Enter your location" class="input-box">
                
                <button class="fa-solid fa-magnifying-glass" id="searchBtn" aria-label="Search location" aria-hidden="false"></button>

            </div>
        </div>

        <div class="location-not-found">
            <h1> Sorry, Location not found!!!</h1>
            <img src="\img\404.png" alt="404 Error">
        </div>
        <div class="weather-body">
            <img src="/img/clear sky.jpg " alt="Weather img" class="weather-img">

            <div class="weather-box">
                <p class="temperature">0°C</p>
                <p class="description">Clear Sky</p>
            </div>

            <div class="weather-details">
                <div class="humidity">
                    <i class="fa-sharp fa-solid fa-droplet"></i>
                    <div class="text">
                        <span id="humidity">45%</span>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="wind">
                    <i class="fa-solid fa-wind"></i>
                    <div class="text">
                        <span id="wind-Speed">10km/H</span>
                        <p>Wind-Speed</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="Weather.js"></script>
    <script src="https://kit.fontawesome.com/b7b3d4206d.js" crossorigin="anonymous"></script>

</body>
</html>
